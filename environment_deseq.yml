name: deseq2-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3          # matches the R version the original analysis used (4.3.3)
  - r-irkernel          # to run the notebook in Jupyter
  - r-ggplot2
  - bioconductor-deseq2
  - bioconductor-tximport
  - bioconductor-ensembldb
  - bioconductor-annotationhub
  - bioconductor-org.hs.eg.db
  - bioconductor-enhancedvolcano
